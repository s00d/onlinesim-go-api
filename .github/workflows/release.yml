name: release

# Push a version tag (vX.Y.Z) to release: run CI, check that CHANGELOG.md has the version, create the GitHub
# release from that section and warm the Go module proxy. Go has no registry upload: the tag is the release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      # Go modules carry no version in go.mod: the tag must match the module's major version and a CHANGELOG section.
      - name: Tag matches module and CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          major=${version%%.*}
          module=$(go list -m)
          case "$module" in
            */v"$major") ;;
            *) if [ "$major" -ge 2 ]; then echo "::error::tag $TAG does not match module path $module"; exit 1; fi ;;
          esac
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::no '## [$version]' section in CHANGELOG.md"
            exit 1
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists, skipping"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --latest --notes-file release-notes.md

      - name: Warm the Go module proxy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          module=$(go list -m)
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://proxy.golang.org/${module}/@v/${TAG}.info"
